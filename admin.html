<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Dr. Fahreen Hannan</title>
  <meta name="theme-color" content="#0C1E24">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <!-- Nothing sensitive renders until Firebase confirms an admin session -->
  <div class="gate" id="gate" role="status" aria-live="polite">
    <span class="pulse-dot" aria-hidden="true"></span><span id="gate-text">Checking your sign-in…</span>
  </div>

  <div class="admin-shell" id="app" hidden>
    <aside class="side" id="side">
      <a class="brand" href="./" target="_blank" rel="noopener" aria-label="Open the website in a new tab">
        <span class="brand__mark" aria-hidden="true">FH</span>
        <span class="brand__name">Admin</span>
      </a>
      <nav aria-label="Admin">
        <p class="side__group">Overview</p>
        <a href="#dashboard" data-route="dashboard">Dashboard</a>
        <p class="side__group">Content</p>
        <a href="#c/activities" data-route="c/activities">Activities</a>
        <a href="#c/articles" data-route="c/articles">Articles</a>
        <a href="#c/media" data-route="c/media">Media / press</a>
        <a href="#c/videos" data-route="c/videos">Videos</a>
        <a href="#c/gallery" data-route="c/gallery">Gallery</a>
        <a href="#c/awards" data-route="c/awards">Awards</a>
        <a href="#c/testimonials" data-route="c/testimonials">Testimonials</a>
        <p class="side__group">Career</p>
        <a href="#c/experiences" data-route="c/experiences">Experience</a>
        <a href="#c/education" data-route="c/education">Education</a>
        <a href="#c/training" data-route="c/training">Training</a>
        <a href="#c/research" data-route="c/research">Research</a>
        <p class="side__group">Site</p>
        <a href="#s/profile" data-route="s/profile">Profile</a>
        <a href="#s/site" data-route="s/site">Site settings &amp; WhatsApp</a>
        <a href="#s/seo" data-route="s/seo">SEO</a>
        <a href="#c/socialLinks" data-route="c/socialLinks">Social links</a>
        <a href="#starter" data-route="starter">Starter content</a>
      </nav>
      <div class="side__foot">
        <p class="side__user" id="who"></p>
        <button class="btn btn--ghost btn--block" type="button" id="logout">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn side-toggle" type="button" id="side-toggle" aria-controls="side" aria-expanded="false" aria-label="Open admin menu">☰</button>
        <h1 class="topbar__title" id="view-title">Dashboard</h1>
        <a class="btn btn--ghost" href="./" target="_blank" rel="noopener">View site</a>
      </header>
      <div class="view" id="view" tabindex="-1"></div>
    </div>
  </div>

  <!-- Editor / preview / confirm dialog -->
  <dialog class="dialog admin-dialog" id="admin-dialog" aria-labelledby="admin-dialog-title">
    <button class="dialog__close" type="button" data-close aria-label="Close">×</button>
    <div class="dialog__body" id="admin-dialog-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
