<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>You are offline | Dr. Fahreen Hannan</title>
  <meta name="theme-color" content="#0C1E24">
  <link rel="icon" href="favicon.ico">
  <style>
    @font-face { font-family: 'Cormorant'; src: url('assets/fonts/cormorant.woff2') format('woff2'); font-weight: 300 700; }
    @font-face { font-family: 'Manrope'; src: url('assets/fonts/manrope.woff2') format('woff2'); font-weight: 200 800; }
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #0C1E24; color: #EEF2EF; font-family: Manrope, system-ui, sans-serif; padding: 2rem calc(1.5rem + env(safe-area-inset-right, 0px)) calc(2rem + env(safe-area-inset-bottom, 0px)) calc(1.5rem + env(safe-area-inset-left, 0px)); box-sizing: border-box; }
    main { max-width: 34rem; }
    .mark { width: 54px; height: 54px; border-radius: 50%; border: 1px solid #D8B26E; color: #D8B26E; display: grid; place-items: center; font-family: Cormorant, Georgia, serif; font-size: 1.3rem; font-weight: 600; margin-bottom: 2rem; }
    h1 { font-family: Cormorant, Georgia, serif; font-weight: 500; font-size: clamp(2.6rem, 8vw, 4rem); line-height: 1; margin: 0 0 1rem; }
    p { color: #93AAA9; font-size: 1.1rem; line-height: 1.6; margin: 0 0 2rem; }
    a, button { display: inline-flex; align-items: center; min-height: 46px; padding: 0 1.4rem; border-radius: 999px; background: #7FD6C2; color: #0C1E24; border: 0; font: 500 1rem Manrope, sans-serif; text-decoration: none; cursor: pointer; margin-right: .6rem; }
    a { background: transparent; color: #EEF2EF; border: 1px solid rgba(238,242,239,.24); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">FH</div>
    <h1>You are offline.</h1>
    <p>Some content may be unavailable. Pages you have already opened still work. Reconnect to see the latest activities.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="./">Open cached home</a>
  </main>
</body>
</html>
