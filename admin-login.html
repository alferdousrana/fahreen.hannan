<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin sign in | Dr. Fahreen Hannan</title>
  <meta name="theme-color" content="#0C1E24">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-auth">
  <main class="auth-card">
    <a class="brand" href="./" aria-label="Back to the website">
      <span class="brand__mark" aria-hidden="true">FH</span>
      <span class="brand__name">Dr. Fahreen Hannan</span>
    </a>
    <h1>Sign in to manage the website</h1>
    <p class="muted">Only approved administrators can sign in.</p>

    <div class="notice notice--warn" id="setup-notice" hidden>
      <strong>Firebase is not connected yet.</strong>
      Add your Firebase web config to <code>js/firebase-config.js</code>, then reload. README → “Firebase setup” walks through every step.
    </div>

    <form id="login-form" novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required inputmode="email">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required minlength="6">
      </label>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit" id="login-btn">Sign in</button>
      <button class="link-btn" type="button" id="reset-btn">Forgot password?</button>
    </form>
    <p class="auth-foot"><a href="./">Back to the website</a></p>
  </main>
  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
